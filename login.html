<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Sign In — Mystical Wellness</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-stone-950 text-stone-200 flex items-center justify-center p-5"><main class="w-full max-w-md rounded-2xl border border-stone-700 bg-stone-900 p-7"><p class="text-lime-300">Mystical Wellness</p><h1 class="mt-1 text-3xl font-serif">Admin sign in</h1><p class="mt-2 text-sm text-stone-400">Use an authorized administrator email to open the dashboard.</p><form id="login-form" class="mt-6 space-y-4"><label class="block text-sm">Email<input id="email" type="email" autocomplete="email" required class="mt-1 w-full rounded-xl border border-stone-700 bg-stone-950 px-3 py-3"></label><label class="block text-sm">Password<input id="password" type="password" autocomplete="current-password" required class="mt-1 w-full rounded-xl border border-stone-700 bg-stone-950 px-3 py-3"></label><button id="submit-button" class="w-full rounded-xl bg-lime-300 px-4 py-3 font-bold text-stone-950">Sign In</button><p id="status" class="hidden text-sm" role="alert"></p></form><a href="index.html" class="mt-6 block text-center text-sm text-stone-400">Return to website</a></main><script type="module">import { auth,isAdminEmail,watchAuth } from './firebase-config.js'; import { signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js'; const form=document.getElementById('login-form'),email=document.getElementById('email'),password=document.getElementById('password'),status=document.getElementById('status'),button=document.getElementById('submit-button'); const show=(m,ok=false)=>{status.textContent=m;status.className=`block text-sm ${ok?'text-lime-300':'text-red-400'}`}; watchAuth(u=>{if(u&&isAdminEmail(u.email))location.replace('admin.html')}); form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;button.textContent='Signing in…';try{const c=await signInWithEmailAndPassword(auth,email.value.trim(),password.value);if(!isAdminEmail(c.user.email)){await auth.signOut();throw new Error('This account is not authorized to access the admin dashboard.')}location.replace('admin.html')}catch(err){show(err.message||'Unable to sign in.');button.disabled=false;button.textContent='Sign In'}});</script></body></html>
