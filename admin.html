<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard — Mystical Wellness</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { display: ['Fraunces', 'Georgia', 'serif'] },
          colors: {
            ink: '#151510', surface: '#201f18', surface2: '#29261e',
            olive: '#9ca86a', stone: '#b5aa96', stone2: '#918878', line: '#554f43'
          }
        }
      }
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { overflow-x: hidden; width: 100%; margin: 0; padding: 0; }
    body { font-family: Inter, sans-serif; }
    .page-wrap { width: 100%; max-width: 72rem; margin: 0 auto; padding: 1.25rem; }
    .tab-btn.active { background: #9ca86a; color: #151510; }
    .tab-panel.hidden { display: none; }
  </style>
</head>

<body class="min-h-screen bg-ink text-stone">

  <header class="sticky top-0 z-40 border-b border-line bg-ink/95 backdrop-blur">
    <div class="page-wrap flex items-center justify-between py-4">
      <span class="font-display text-xl text-stone">Mystical Wellness — Admin</span>
      <button id="logout-btn" class="rounded-full border border-line px-4 py-2 text-sm text-stone2 hover:border-olive hover:text-olive transition">Log Out</button>
    </div>
  </header>

  <main class="page-wrap py-10">

    <div class="flex flex-wrap gap-2">
      <button data-tab="orders" class="tab-btn active rounded-full border border-line px-4 py-2 text-sm font-bold transition">Orders</button>
      <button data-tab="codes" class="tab-btn rounded-full border border-line px-4 py-2 text-sm font-bold text-stone2 transition">Verify Reward Code</button>
      <button data-tab="points" class="tab-btn rounded-full border border-line px-4 py-2 text-sm font-bold text-stone2 transition">Adjust Points</button>
    </div>

    <!-- ORDERS TAB -->
    <div id="tab-orders" class="tab-panel mt-6">
      <div class="flex flex-wrap gap-3">
        <select id="status-filter" class="rounded-xl border border-line bg-surface p-2 text-sm text-stone">
          <option value="">All statuses</option>
          <option value="New">New</option>
          <option value="Completed">Completed</option>
          <option value="Cancelled">Cancelled</option>
        </select>
        <button id="refresh-orders" class="rounded-xl border border-line px-3 py-2 text-sm text-stone2 hover:border-olive transition">Refresh</button>
      </div>
      <div id="orders-table" class="mt-4 space-y-3"></div>
    </div>

    <!-- VERIFY REWARD CODE TAB -->
    <div id="tab-codes" class="tab-panel mt-6 hidden">
      <div class="max-w-md rounded-2xl border border-line bg-surface p-5">
        <label class="text-sm block">
          Enter reward code shown by customer
          <input id="code-input" placeholder="MW-1234" class="mt-1 block w-full rounded-xl border border-line bg-ink p-3 text-stone focus:border-olive outline-none" />
        </label>
        <button id="verify-code-btn" class="mt-3 rounded-xl bg-olive px-5 py-3 text-sm font-bold text-ink hover:bg-olive/90 transition">Check Code</button>
        <div id="code-result" class="mt-4 hidden rounded-xl border border-line p-4 text-sm"></div>
      </div>
    </div>

    <!-- ADJUST POINTS TAB -->
    <div id="tab-points" class="tab-panel mt-6 hidden">
      <div class="max-w-md rounded-2xl border border-line bg-surface p-5">
        <label class="text-sm block">
          Customer email
          <input id="points-email" placeholder="customer@email.com" class="mt-1 block w-full rounded-xl border border-line bg-ink p-3 text-stone focus:border-olive outline-none" />
        </label>
        <label class="mt-3 text-sm block">
          Point change (use negative to subtract, e.g. -10)
          <input id="points-delta" type="number" class="mt-1 block w-full rounded-xl border border-line bg-ink p-3 text-stone focus:border-olive outline-none" />
        </label>
        <label class="mt-3 text-sm block">
          Reason <span class="text-red-400">*</span> (required, kept as audit trail)
          <textarea id="points-reason" required class="mt-1 block w-full rounded-xl border border-line bg-ink p-3 text-stone focus:border-olive outline-none" rows="2"></textarea>
        </label>
        <button id="adjust-points-btn" class="mt-3 rounded-xl bg-olive px-5 py-3 text-sm font-bold text-ink hover:bg-olive/90 transition">Apply Adjustment</button>
        <p id="points-result" class="mt-3 hidden text-xs font-medium"></p>
      </div>
    </div>

  </main>

  <script type="module">
    import {
      auth, watchAuth, logOut, isAdminEmail, getAllOrders, markOrderCompletedAndAwardPoints,
      markOrderCancelled, markRewardCodeUsed, adjustUserPoints, db
    } from './firebase-config.js';
    import { collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);
    let currentAdmin = null;
    let allOrders = [];

    watchAuth((user) => {
      if (!user || !isAdminEmail(user.email)) { window.location.href = 'login.html'; return; }
      currentAdmin = user;
      loadOrders();
    });

    $('logout-btn').addEventListener('click', async () => { await logOut(); window.location.href = 'index.html'; });

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active'); b.classList.add('text-stone2'); });
        btn.classList.add('active'); btn.classList.remove('text-stone2');
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
        $(`tab-${btn.dataset.tab}`).classList.remove('hidden');
      });
    });

    async function loadOrders() {
      allOrders = await getAllOrders();
      renderOrders();
    }

    function renderOrders() {
      const filter = $('status-filter').value;
      const filtered = filter ? allOrders.filter(o => o.status === filter) : allOrders;

      if (filtered.length === 0) {
        $('orders-table').innerHTML = '<p class="text-stone2 text-sm">No orders found.</p>';
        return;
      }

      $('orders-table').innerHTML = filtered.map(o => {
        const created = o.createdAt?.toDate ? o.createdAt.toDate() : new Date();
        const statusColor = o.status === 'Completed' ? 'text-olive' : o.status === 'Cancelled' ? 'text-red-400' : 'text-stone2';
        return `
          <div class="rounded-xl border border-line bg-surface p-4">
            <div class="flex flex-wrap justify-between gap-2 text-sm">
              <b class="text-stone">${o.customerName || 'Guest'} · ${o.customerPhone || ''}</b>
              <span class="${statusColor} font-semibold">${o.status}</span>
            </div>
            <p class="mt-1 text-sm text-stone2">${o.itemsText} — $${Number(o.subtotal || 0).toFixed(2)} · ${o.mode}</p>
            <p class="mt-1 text-xs text-stone2">${created.toLocaleString()} · ${o.uid ? 'Member' : 'Guest'}</p>
            ${o.status === 'New' ? `
              <div class="mt-3 flex gap-2">
                <button data-id="${o.id}" class="complete-btn rounded-full bg-olive px-4 py-2 text-xs font-bold text-ink hover:bg-olive/90 transition">Mark Completed</button>
                <button data-id="${o.id}" class="cancel-btn rounded-full border border-red-800 px-4 py-2 text-xs font-bold text-red-300 hover:bg-red-950/40 transition">Cancel</button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');

      document.querySelectorAll('.complete-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          await markOrderCompletedAndAwardPoints(btn.dataset.id);
          loadOrders();
        });
      });
      document.querySelectorAll('.cancel-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          await markOrderCancelled(btn.dataset.id);
          loadOrders();
        });
      });
    }

    $('status-filter').addEventListener('change', renderOrders);
    $('refresh-orders').addEventListener('click', loadOrders);

    $('verify-code-btn').addEventListener('click', async () => {
      const code = $('code-input').value.trim().toUpperCase();
      const snap = await getDoc(doc(db, 'rewardCodes', code));
      const resultBox = $('code-result');
      resultBox.classList.remove('hidden');

      if (!snap.exists()) {
        resultBox.innerHTML = '<span class="text-red-400">Code not found.</span>';
        return;
      }
      const data = snap.data();
      if (data.status === 'used') {
        resultBox.innerHTML = `<span class="text-red-400">This code was already used.</span>`;
        return;
      }
      resultBox.innerHTML = `
        <p class="text-olive font-semibold">Valid — ${data.reward}</p>
        <button id="mark-used-btn" class="mt-2 rounded-full bg-olive px-4 py-2 text-xs font-bold text-ink hover:bg-olive/90 transition">Mark as Used</button>
      `;
      $('mark-used-btn').addEventListener('click', async () => {
        await markRewardCodeUsed(code);
        resultBox.innerHTML = '<span class="text-olive">Marked as used.</span>';
      });
    });

    $('adjust-points-btn').addEventListener('click', async () => {
      const resultEl = $('points-result');
      resultEl.classList.remove('hidden');
      try {
        const email = $('points-email').value.trim();
        const delta = Number($('points-delta').value);
        const reason = $('points-reason').value.trim();

        const q = query(collection(db, 'users'), where('email', '==', email));
        const snap = await getDocs(q);
        if (snap.empty) throw new Error('No customer found with that email.');

        const uid = snap.docs[0].id;
        await adjustUserPoints(uid, delta, reason, currentAdmin.email);

        resultEl.textContent = 'Points adjusted successfully.';
        resultEl.className = 'mt-3 block text-xs font-medium text-olive';
        $('points-email').value = ''; $('points-delta').value = ''; $('points-reason').value = '';
      } catch (err) {
        resultEl.textContent = 'Error: ' + err.message;
        resultEl.className = 'mt-3 block text-xs font-medium text-red-400';
      }
    });
  </script>
</body>
</html>
